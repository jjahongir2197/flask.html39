<!DOCTYPE html>
<html>
<head>
    <title>Task Timer</title>
</head>
<body>

    <h1>Task Timer</h1>

    <form method="POST">

        <input type="text"
        name="task"
        placeholder="Task name">

        <br><br>

        <input type="time"
        name="time">

        <br><br>

        <button type="submit">
            Add Task
        </button>

    </form>

    <hr>

    {% for task in tasks %}

        <h2>{{ task.task }}</h2>

        <p>Time: {{ task.time }}</p>

        <a href="/delete/{{ loop.index0 }}">
            Delete
        </a>

        <hr>

    {% endfor %}

</body>
</html>
